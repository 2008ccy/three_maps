name: Website checks and GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', 'feedback-cloud/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'feedback-cloud/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_BASE_PATH: /three_maps
      # Public build-time configuration; unset repository variables keep the
      # service disabled. No database or administrator credentials belong here.
      NEXT_PUBLIC_WORKBUDDY_CLOUD_ENDPOINT: ${{ vars.NEXT_PUBLIC_WORKBUDDY_CLOUD_ENDPOINT }}
      NEXT_PUBLIC_WORKBUDDY_CLOUD_KEY: ${{ vars.NEXT_PUBLIC_WORKBUDDY_CLOUD_KEY }}
      NEXT_PUBLIC_FEEDBACK_API_BASE_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_API_BASE_URL }}
      NEXT_PUBLIC_FEEDBACK_SERVICE_VERIFIED: ${{ vars.NEXT_PUBLIC_FEEDBACK_SERVICE_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            feedback-cloud/package-lock.json
      - run: npm ci
      - run: npm --prefix ../feedback-cloud ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run check:export
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
